<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Physical Sheet of Paper -->
  <div class="paper-sheet">

    <!-- Top-Right Unobtrusive Collaboration Trigger & Popover -->
    <div class="collab-container">
      <button id="collab-trigger" class="collab-trigger" title="Collaboration / Room" aria-label="Room Settings">
        <span id="status-indicator" class="status-indicator connecting">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text">Connecting...</span>
        </span>
        <!-- Lucide Share-2 Icon -->
        <svg class="collab-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>

      <!-- Minimal Popover Card (Appears only on demand) -->
      <div id="collab-popover" class="collab-popover hidden">
        <div class="collab-form">
          <input
            type="text"
            id="room-code-input"
            class="room-code-field"
            placeholder="ROOM CODE"
            maxlength="8"
            spellcheck="false"
            autocomplete="off"
          />
          <button id="btn-join-room" class="paper-icon-btn" title="Join Room" aria-label="Join Room">
            <!-- Lucide ArrowRight Icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
          <button id="btn-create-room" class="paper-icon-btn" title="Create New Room" aria-label="Create New Room">
            <!-- Lucide Plus Icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div id="room-feedback" class="room-feedback hidden"></div>
      </div>
    </div>

    <!-- Paper Workspace (Full Sheet Focus) -->
    <main class="paper-workspace">
      <div id="shared-board-area" class="board-surface">
        <textarea
          id="board-text-input"
          class="paper-textarea"
          placeholder="Start typing..."
          spellcheck="false"
        ></textarea>
        <canvas id="board-canvas" class="paper-canvas"></canvas>
      </div>
    </main>

    <!-- Floating Minimal Stationery Dock -->
    <div class="dock-container">
      <!-- Stationery Drawer (Swatches & Nibs - visible during drawing/erasing) -->
      <div id="stationery-tray" class="stationery-tray hidden">
        <!-- 5 Ink drops -->
        <div id="color-palette-group" class="tray-group">
          <div class="color-palette">
            <button class="ink-swatch active" data-color="#1f1f1f" title="Black ink" style="--ink-color: #1f1f1f;"></button>
            <button class="ink-swatch" data-color="#dc2626" title="Madder red ink" style="--ink-color: #dc2626;"></button>
            <button class="ink-swatch" data-color="#2563eb" title="Fountain blue ink" style="--ink-color: #2563eb;"></button>
            <button class="ink-swatch" data-color="#16a34a" title="Moss green ink" style="--ink-color: #16a34a;"></button>
            <button class="ink-swatch" data-color="#9333ea" title="Plum purple ink" style="--ink-color: #9333ea;"></button>
          </div>
        </div>

        <div class="tray-divider"></div>

        <!-- Nib / Eraser Sizes -->
        <div id="size-selector-group" class="tray-group">
          <div class="size-palette">
            <button class="size-dot-btn" data-size="small" title="Fine">
              <span class="nib-dot small"></span>
            </button>
            <button class="size-dot-btn active" data-size="medium" title="Medium">
              <span class="nib-dot medium"></span>
            </button>
            <button class="size-dot-btn" data-size="large" title="Broad">
              <span class="nib-dot large"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Core Stationery Tools: Text, Pen, Eraser, Clear -->
      <nav class="stationery-dock" aria-label="Canvas Tools">
        <button class="stationery-btn active" data-tool="text" title="Type (Notes)" aria-label="Text Mode">
          <!-- Lucide Type Icon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"/>
            <line x1="9" y1="20" x2="15" y2="20"/>
            <line x1="12" y1="4" x2="12" y2="20"/>
          </svg>
        </button>

        <button class="stationery-btn" data-tool="pen" title="Pen" aria-label="Pen Mode">
          <!-- Lucide Pencil Icon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            <path d="m15 5 4 4"/>
          </svg>
        </button>

        <button class="stationery-btn" data-tool="eraser" title="Eraser" aria-label="Eraser Mode">
          <!-- Lucide Eraser Icon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
            <path d="M22 21H7"/>
            <path d="m5 11 9 9"/>
          </svg>
        </button>

        <div class="dock-separator"></div>

        <button id="btn-clear-board" class="stationery-btn clear-btn" title="Clear Canvas" aria-label="Clear Canvas">
          <!-- Lucide Trash-2 Icon (Quieter secondary action) -->
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        </button>
      </nav>
    </div>

  </div>

  <!-- Multi-source Socket.IO loading: relative URL for browser, localhost/CDN for file:// Electron -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    if (typeof io === 'undefined') {
      document.write('<script src="http://localhost:3000/socket.io/socket.io.js"><\/script>');
    }
  </script>
  <script>
    if (typeof io === 'undefined') {
      document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
